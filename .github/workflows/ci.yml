name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest

  # Ponta a ponta: API + interface + Postgres de verdade, com um navegador (Playwright) usando as telas.
  # Só roda se lint, testes da API e build passarem (falha rápida e barata primeiro).
  e2e:
    needs: [api, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buscapet
          POSTGRES_PASSWORD: buscapet
          POSTGRES_DB: buscapet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buscapet" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://buscapet:buscapet@localhost:5432/buscapet
      JWT_SECRET: segredo-somente-para-a-ci
      PGTZ: America/Recife # sessão do banco no fuso dos usuários, como na máquina do time
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências e banco
        working-directory: api
        run: |
          pip install -r requirements.txt
          alembic upgrade head
      - name: Dependências da interface e navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        working-directory: frontend
        run: npx playwright test
      - name: Relatório do Playwright (vídeo, trace e capturas das falhas)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: frontend/playwright-report/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
