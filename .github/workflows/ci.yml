name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      # Sprint 9: mede a cobertura e falha se cair abaixo de 90% (estava em 94% ao fechar a sprint).
      - run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90

  # Ponta a ponta: API + interface + Postgres de verdade, com um navegador (Playwright) usando as telas.
  # Só roda se lint, testes da API e build passarem (falha rápida e barata primeiro).
  e2e:
    needs: [api, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buscapet
          POSTGRES_PASSWORD: buscapet
          POSTGRES_DB: buscapet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buscapet" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # O Playwright cria e migra sozinho o banco buscapet_e2e neste Postgres (ver frontend/playwright.config.js).
      JWT_SECRET: segredo-somente-para-a-ci
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências da API
        working-directory: api
        run: pip install -r requirements.txt
      - name: Dependências da interface e navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        working-directory: frontend
        run: npx playwright test
      - name: Relatório do Playwright (vídeo, trace e capturas das falhas)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: frontend/playwright-report/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  nucleo-opencl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O build compila com -Wall -Wextra e roda `make teste` (equivalência
      # sequencial x OpenCL via PoCL); se o kernel errar, a imagem não é gerada.
      - name: Compilar e testar o núcleo
        run: docker build -t buscapet-nucleo nucleo-opencl
      - name: Subir o serviço e conferir /saude
        run: |
          docker run -d --name nucleo -p 8001:8001 buscapet-nucleo
          for i in $(seq 1 15); do
            curl -sf localhost:8001/saude && exit 0
            sleep 1
          done
          docker logs nucleo
          exit 1
