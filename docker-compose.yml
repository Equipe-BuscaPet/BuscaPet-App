services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buscapet
      POSTGRES_PASSWORD: buscapet
      POSTGRES_DB: buscapet
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ./api
    # Desenvolvimento: recarrega a cada mudança no código (a imagem, sozinha, roda em modo de produção).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://buscapet:buscapet@db:5432/buscapet
      NUCLEO_OPENCL_URL: http://nucleo-opencl:8001
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./api:/app

  nucleo-opencl:
    build: ./nucleo-opencl
    ports:
      - "8001:8001"
    # Serviço em C + OpenCL (PoCL, roda na CPU). O build da imagem só termina
    # se o teste de equivalência passar. Conferir: curl localhost:8001/saude
    # Detalhes em nucleo-opencl/README.md.

  frontend:
    build: ./frontend
    env_file: .env
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
